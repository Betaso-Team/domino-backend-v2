services:
  # SIN PERFILES, que es lo que el dominó decide distinto que truco. Allá los perfiles existen
  # porque cada operador quiere un subconjunto de los almacenamientos, y acá también hay dos
  # —Mongo para el historial, Redis para el clúster—; la diferencia es que la ELECCIÓN YA ESTÁ
  # TOMADA EN OTRO LADO Y CON OTRO MECANISMO: la presencia de `MONGO_URI` elige la implementación
  # del historial, y la de `REDIS_URL` elige si este proceso es un clúster de uno o parte de uno
  # más grande (ver `.env.example` y `src/di-container.ts`). Un perfil sería un SEGUNDO
  # interruptor para cada una de esas decisiones, y dos interruptores para una decisión es la
  # combinación incoherente que ese diseño vino a impedir.
  #
  # Y el subconjunto que el perfil daría, esto ya lo da: `docker compose up mongo` levanta uno
  # solo, sin un `COMPOSE_PROFILES` más que acordarse de poner.

  # REDIS, y no es una optimización: es lo que hace que DOS PROCESOS SEAN UN SERVIDOR. Del otro
  # lado viven el registro de salas de Colyseus —sin él, `joinById` contra una sala de otro
  # proceso no encuentra nada—, el presence con el que los procesos se enteran unos de otros, y
  # el registro de partidas vivas del dominó, que es de donde sale que `GET /config/:roomId`
  # conteste por una sala que abrió la otra instancia.
  #
  # SIN VOLUMEN, al revés que Mongo, y la asimetría es la decisión: acá adentro no hay ningún
  # dato que deba sobrevivir al ciclo. Todo lo que se escribe es estado de EJECUCIÓN —qué salas
  # hay vivas, qué procesos están arriba— y todo tiene plazo. Un volumen solo serviría para
  # rearrancar con la lista de salas de un clúster que ya no existe.
  redis:
    image: redis:7-alpine
    ports:
      # ATADO A LOOPBACK, y el prefijo `127.0.0.1:` no es cosmético. Sin él compose publica en
      # `0.0.0.0`, o sea que este Redis —que no pide contraseña— queda alcanzable desde
      # cualquier máquina de la red. Un Redis abierto no es solo lectura de datos: `CONFIG SET
      # dir` + `dbfilename` lo convierten en escritura de archivos arbitrarios, que es el
      # camino conocido a ejecución remota. Se publica igual porque inspeccionarlo con
      # `redis-cli` desde el host es parte de operarlo; lo que no hace falta es que lo alcance
      # la LAN del café.
      #
      # El puerto del HOST es configurable por la misma razón que el de Mongo: es fácil que ya
      # haya otro Redis escuchando en el 6379, sobre todo si el mismo operador corre truco al
      # lado. `REDIS_PORT` sale del `.env` de al lado, que compose interpola solo; no es una
      # variable de `src/env.ts` y por eso no está en `.env.example`.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      # ATADO A LOOPBACK por lo mismo que Redis: sin el `127.0.0.1:` esto es un Mongo sin
      # autenticación escuchando a la red entera, y adentro está el historial de las partidas
      # —quién jugó qué y contra quién—. Se publica igual porque `mongosh` desde el host es
      # como se audita una partida; lo que no hace falta es que la LAN lo lea.
      #
      # El puerto del HOST es configurable porque es fácil que ya haya otro Mongo escuchando en
      # el 27017, sobre todo si el mismo operador corre truco al lado. `MONGO_PORT` sale del
      # `.env` de al lado, que compose interpola solo; no es una variable de `src/env.ts` y por
      # eso no está en `.env.example` —ese archivo documenta al único lector de `process.env`—.
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    # CON VOLUMEN NOMBRADO, que truco no tiene. La imagen declara `VOLUME /data/db`, así que
    # sin esto cada contenedor se lleva un volumen ANÓNIMO: `docker compose down` deja el de
    # ayer huérfano y el siguiente `up` arranca con una base vacía. Nombrarlo es lo que hace
    # que el historial sobreviva al ciclo, que es lo único que este servicio existe para dar.
    # Medido: `up` → partida → `down` → `up` y el documento seguía ahí.
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  domino:
    build: .
    ports:
      # Configurable por la MISMA razón que el de Mongo, y acá el choque no es probable sino
      # seguro: truco escucha en el 2567 y el default del dominó es el 2567.
      - "${DOMINO_PORT:-2567}:2567"
    # `JWT_SECRET` e `INTERNAL_API_KEY` salen del `.env` de al lado (ver `.env.example`). Sin la
    # primera el proceso NO ARRANCA —a propósito—; sin la segunda arranca, pero
    # `/internal/matches/:matchId/history` no se registra y responde 404 (fail closed en
    # `register-http.ts`). Un compose que no pasara el `.env` sería un 404 sin explicación.
    env_file:
      - .env
    environment:
      - PORT=2567
      - NODE_ENV=production
      # LA FIJA EL COMPOSE, no el `.env`: acá el host es el nombre del servicio y no
      # `127.0.0.1`, que es lo que el `.env.example` sugiere para correr fuera del contenedor.
      # Dejarla en el `.env` obligaría a editarla para ir de un modo al otro. `environment` le
      # gana a `env_file`, así que una `MONGO_URI` suelta en el `.env` no rompe esto.
      - MONGO_URI=mongodb://mongo:27017/domino
      # LA MISMA REGLA que la de Mongo: el host es el nombre del servicio. EL `/1` DEL FINAL ES EL
      # ÍNDICE DE BASE, y es el aislamiento entre dos productos sobre el mismo servidor de Redis
      # —el operador que corre el truco al lado—: un carácter de esta línea y no una variable más.
      # Es lo que reemplaza al `REDIS_KEY_PREFIX` de truco, y está MEDIDO —dos instancias, una en
      # cada índice, cada una ciega a las salas de la otra— en el comentario de `src/env.ts`.
      #
      # ES `/1` Y NO `/0`: el `0` es donde cae todo el que no eligió, empezando por truco, que
      # arma sus clientes de Redis sin `db`. Este servicio tiene su propio Redis, así que el
      # número acá no cambia nada — y por eso mismo vale que diga el correcto, que es el que se
      # copia el día que haya un solo Redis para los dos.
      - REDIS_URL=redis://redis:6379/1
    # CON `depends_on`, al revés que truco, y la diferencia es el porqué de allá: truco lo omite
    # porque depender de un servicio apagado por perfil rompe el compose entero y dejaría los
    # perfiles decorativos. Acá no hay perfiles, así que ese costo no existe.
    #
    # Lo que NO es: una garantía de que mongod acepte conexiones. Sin `condition:
    # service_healthy` esto espera a que el CONTENEDOR arranque, nada más. Que el orden igual no
    # importe lo sigue dando la conexión perezosa de `src/shared/mongo.ts`: el proceso levanta
    # con la base caída y el primer documento paga la espera.
    #
    # Y AHORA SÍ HAY UN `/ready` QUE DICE CUÁNDO LLEGÓ (`src/shared/http/health.ts`), pero NO ES
    # PARA ESTO y por eso el `depends_on` no cambia: su consumidor es el balanceador que reparte
    # jugadores entre varias instancias, no compose, que no sabe consultarlo sin un `healthcheck`
    # declarado acá. Engancharlo como healthcheck del servicio haría que `docker compose up`
    # esperara a Mongo para dar el servidor por listo — justo lo contrario de la conexión
    # perezosa, que existe para que una base lenta no impida jugar.
    #
    # Lo que sí compra, gratis: `docker compose up domino` se trae Mongo, el apagado va en
    # orden, y la ventana en la que un lote de historial se pierde queda lo más corta posible
    # —`MongoHistory.record` es `void` por contrato y un fallo se LOGUEA, no se reintenta—.
    #
    # REDIS ENTRA EN LA MISMA LISTA y con la misma advertencia: ordena el arranque, no garantiza
    # que Redis conteste. Que el orden no importe lo da ioredis, que reintenta la conexión sola.
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

volumes:
  mongo-data:
