map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;

  # EL DOBLE DE LA LIGA. El servidor le reporta acá el cierre de cada partida
  # (`network/transports/http-leagues.ts`), y en el smoke ese destino tiene que existir y NO ser
  # el backend real: la ruta productiva no pide credencial, así que un `BACKEND_URL` productivo
  # acá le metería un resultado inventado a la liga de verdad en cada corrida.
  #
  # `=` ES EXACTO Y POR ESO GANA al `location /` de abajo, que proxya todo lo demás al servidor.
  # Sin el `=`, el prefijo más largo seguiría ganando pero cualquier ruta que empiece igual
  # también caería acá.
  #
  # ⚠ CONTESTA 204 Y NO REGISTRA NADA, así que el smoke **no certifica la liga**: pasa igual si el
  # reporte no sale. Es deliberado y es el límite de este doble — certificarla pide un stub que
  # GUARDE lo que recibió y un cliente que lo lea, que es un incremento propio. Lo que sí evita es
  # el falso rojo de un POST fallando contra un 404 en cada cierre de partida.
  location = /leagues/save {
    return 204;
  }

  location /2567/ {
    rewrite ^/2567/(.*)$ /$1 break;
    proxy_pass http://domino:2567;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
  }

  location /2568/ {
    rewrite ^/2568/(.*)$ /$1 break;
    proxy_pass http://domino:2568;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
  }

  location / {
    proxy_pass http://domino:2567;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
  }
}
