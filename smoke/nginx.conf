map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;

  # EL DOBLE DEL ORQUESTADOR: aprueba todo cobro que le pide una mesa. No registra nada — el smoke certifica que la mesa pide el cobro y arranca con el sí, no el cobro.
  location ~ ^/orchestrator/internal/matches/[^/]+/(charges|bets)$ {
    default_type application/json;
    return 200 '{}';
  }

  location /2567/ {
    rewrite ^/2567/(.*)$ /$1 break;
    proxy_pass http://domino:2567;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
  }

  location /2568/ {
    rewrite ^/2568/(.*)$ /$1 break;
    proxy_pass http://domino:2568;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
  }

  location / {
    proxy_pass http://domino:2567;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
  }
}
