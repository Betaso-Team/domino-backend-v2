name: domino-engine-smoke

services:
  redis:
    image: redis:7-alpine

  mongo:
    image: mongo:7

  # EL BROKER DE JUEGOS (el resultado de cada mesa), CON HEALTHCHECK Y NO CON UN `depends_on` PELADO.
  # `depends_on` sin condición sólo espera a que el contenedor ARRANQUE, y RabbitMQ tarda segundos más
  # en aceptar conexiones: sin esto la app arrancaría contra un puerto que todavía no atiende y, con
  # `recovery: true`, `amqplib` no falla —reintenta para siempre—, así que el síntoma sería un
  # `/ready` colgado y no un error.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  domino:
    build:
      context: .
      target: smoke-server
    environment:
      NODE_ENV: production
      PORT: 2567
      PM2_INSTANCES: 2
      SERVER_ADDRESS: nginx:8080
      ADMIN_API_KEY: smoke-admin-key-with-more-than-16-chars-ok
      REDIS_URL: redis://redis:6379/1
      MONGO_URI: mongodb://mongo:27017/domino-smoke
      # EL ORQUESTADOR DEL SMOKE ES EL NGINX DEL STACK: el smoke juega una mesa, y una mesa arranca
      # solo si el orquestador cobra la entrada. El nginx
      # aprueba todo cobro (`smoke/nginx.conf`); no certifica el cobro, certifica que la mesa lo pide
      # y arranca con el sí. La clave pública es la de la pareja fija de `src/tests/billing-auth-keys.ts`,
      # con cuya privada el cliente del smoke firma los tokens de sus jugadores.
      ORCHESTRATOR_API_KEY: smoke-orchestrator-key-with-more-than-16-chars
      ORCHESTRATOR_URL: http://nginx:8080/orchestrator/
      ORCHESTRATOR_CALLBACK_API_KEY: smoke-orchestrator-callback-key-16-chars
      BILLING_AUTH_PUBLIC_KEY: |
        -----BEGIN PUBLIC KEY-----
        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAECA+1agnfjWJeneGON5dirYjnShiD
        MG7S65FJUbx3H9OWgE79m9n1e27UMWVhrNNk+fLAoaBoqRG6RtbdZuhtEw==
        -----END PUBLIC KEY-----
      # El resultado sale al vhost por defecto del broker del smoke, donde nadie lo consume: con
      # `mandatory`, el outbox lo reintenta sin perderlo y sin molestar a la partida.
      BETASO_GAMES_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      TURN_TIMEOUT_MS: 5000
      EXTRA_TIME_RESERVE_MS: 1000
      DEALING_TIMEOUT_MS: 5000
      PRESENTING_ROUND_MS: 20
      PRESENTING_MATCH_MS: 20
      # La partida termina en la ventana de revancha (30 s por defecto) y no en FINISHED: el smoke
      # espera 5 s como máximo a que el estado cambie, así que la ventana tiene que ser más corta.
      REMATCH_WINDOW_MS: 20
      SEATING_TIMEOUT_MS: 5000
      RECONNECTION_WINDOW_SECONDS: 5
    depends_on:
      redis:
        condition: service_started
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:1.30.4-alpine3.24
    volumes:
      - ./smoke/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - domino

  # EL CLIENTE juega una partida 2P contra el stack (`npm run smoke:client`). El runner lo invoca con
  # `--no-deps`: el stack ya está arriba.
  smoke-client:
    build:
      context: .
      target: smoke-client
    environment:
      NODE_ENV: test
      # `env.ts` la exige al importarse; el cliente no verifica nada con ella.
      BILLING_AUTH_PUBLIC_KEY: |
        -----BEGIN PUBLIC KEY-----
        MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAECA+1agnfjWJeneGON5dirYjnShiD
        MG7S65FJUbx3H9OWgE79m9n1e27UMWVhrNNk+fLAoaBoqRG6RtbdZuhtEw==
        -----END PUBLIC KEY-----
      ADMIN_API_KEY: smoke-admin-key-with-more-than-16-chars-ok
      RUN_ENGINE_SMOKE: 1
    depends_on:
      - nginx
