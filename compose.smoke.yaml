name: domino-engine-smoke

services:
  redis:
    image: redis:7-alpine

  mongo:
    image: mongo:7

  domino:
    build:
      context: .
      target: smoke-server
    environment:
      NODE_ENV: production
      PORT: 2567
      PM2_INSTANCES: 2
      SERVER_ADDRESS: nginx:8080
      JWT_SECRET: smoke-jwt-secret-with-more-than-16-chars
      INTERNAL_API_KEY: smoke-internal-key-with-more-than-16-chars
      REDIS_URL: redis://redis:6379/1
      MONGO_URI: mongodb://mongo:27017/domino-smoke
      TURN_TIMEOUT_MS: 5000
      EXTRA_TIME_RESERVE_MS: 1000
      DEALING_TIMEOUT_MS: 5000
      PRESENTING_ROUND_MS: 20
      PRESENTING_MATCH_MS: 20
      SEATING_TIMEOUT_MS: 5000
      RECONNECTION_WINDOW_SECONDS: 5
    depends_on:
      redis:
        condition: service_started
      mongo:
        condition: service_started

  nginx:
    image: nginx:1.30.4-alpine3.24
    volumes:
      - ./smoke/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - domino

  # EL CLIENTE MIDE DESDE AFUERA, y por eso recibe `MONGO_URI` además de hablar HTTP: un cliente
  # que sólo pidiera por HTTP mediría lo que el servidor DICE, no lo que quedó escrito.
  smoke-client:
    build:
      context: .
      target: smoke-client
    environment:
      NODE_ENV: test
      JWT_SECRET: smoke-jwt-secret-with-more-than-16-chars
      INTERNAL_API_KEY: smoke-internal-key-with-more-than-16-chars
      MONGO_URI: mongodb://mongo:27017/domino-smoke
      RUN_ENGINE_SMOKE: 1
    depends_on:
      - nginx
